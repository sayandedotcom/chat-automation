services:
  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatautomation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ─── Express API Server ───
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chatautomation?schema=public
      - APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
      - API_BASE_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      # BETTER_AUTH_URL must match the web app frontend domain so OAuth cookies are same-origin
      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
      - AGENT_API_URL=http://agent:8001
    command: sh -c "pnpm --filter @workspace/database db:push && pnpm --filter api dev"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── Next.js Web Frontend ───
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      # NEXT_PUBLIC_* are read from runtime env in next dev mode (no build-time baking)
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:8080}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      # Internal URL for Next.js server-side requests
      - INTERNAL_API_URL=http://api:8000
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chatautomation?schema=public
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ─── Python AI Agent (FastAPI) ───
  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/chatautomation?schema=public
    expose:
      - "8001"
    volumes:
      - agent_credentials:/root/.google_workspace_mcp
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ─── Nginx Reverse Proxy ───
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  agent_credentials:
