# Codecov Configuration
# https://docs.codecov.io/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "60...90"

  status:
    project:
      default:
        target: auto
        threshold: 2%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 5%

parsers:
  gcov:
    branch_detection:
      conditional: true
      loop: true
      macro: false
      method: false

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: true
  require_base: false
  require_head: true
  hide_project_coverage: false

flags:
  web:
    paths:
      - apps/web/
    carryforward: true
  api:
    paths:
      - apps/api/
    carryforward: true
  agent:
    paths:
      - apps/agent/
    carryforward: true

ignore:
  - "**/*.test.*"
  - "**/*.spec.*"
  - "**/node_modules/**"
  - "packages/eslint-config/**"
  - "packages/prettier-config/**"
  - "packages/typescript-config/**"
  - "nginx/**"
  - "docs/**"
