name: Agent

on:
  push:
    branches: [master]
    paths:
      - "apps/agent/**"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [master]
    paths:
      - "apps/agent/**"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: apps/agent
        run: uv sync --all-extras

      - name: Test
        working-directory: apps/agent/chat
        run: uv run pytest tests/ -v
        continue-on-error: true

  deploy:
    name: Deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub Deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          deployment_id=$(gh api repos/${{ github.repository }}/deployments \
            -X POST \
            -f ref="${{ github.sha }}" \
            -f environment="agent-production" \
            -f auto_merge=false \
            -f required_contexts='[]' \
            -f description="Agent deployment to production" \
            --jq '.id')
          echo "deployment_id=$deployment_id" >> $GITHUB_OUTPUT
          gh api repos/${{ github.repository }}/deployments/$deployment_id/statuses \
            -X POST \
            -f state="in_progress" \
            -f description="Deploying Agent to production..."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Unlock SST
        working-directory: apps/agent
        run: npx sst unlock --stage production || true

      - name: Deploy
        id: deploy
        working-directory: apps/agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
          LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
        run: npx sst deploy --stage production

      - name: Update Deployment Status (Success)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deployment_id }}/statuses \
            -X POST \
            -f state="success" \
            -f description="Agent deployed successfully" \
            -f environment_url="https://agent.sayande.xyz"

      - name: Update Deployment Status (Failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/deployments/${{ steps.deployment.outputs.deployment_id }}/statuses \
            -X POST \
            -f state="failure" \
            -f description="Agent deployment failed"
