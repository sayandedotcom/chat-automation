# Automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # npm dependencies (monorepo root)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "automated"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
      trpc:
        patterns:
          - "@trpc/*"
      dev-tools:
        patterns:
          - "eslint*"
          - "prettier*"
          - "typescript"
          - "turbo"
          - "husky"
          - "lint-staged"
          - "@commitlint/*"

  # Python dependencies (agent)
  - package-ecosystem: "pip"
    directory: "/apps/agent"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
    labels:
      - "dependencies"
      - "python"
      - "automated"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci):"
    labels:
      - "ci"
      - "automated"

  # Docker
  - package-ecosystem: "docker"
    directory: "/apps/agent"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(docker):"
    labels:
      - "docker"
      - "automated"
