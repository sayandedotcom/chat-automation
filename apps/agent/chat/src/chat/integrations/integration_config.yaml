      - "update_drive_file"
      - "get_drive_shareable_link"
      - "share_drive_file"
      - "batch_share_drive_file"
      - "update_drive_permission"
      - "remove_drive_permission"
      - "copy_drive_file"
      - "transfer_drive_ownership"
    display_name: "Google Drive"
    icon: "drive"
    requires_auth: true
    mcp_server: "google_workspace"
    description: "File management via Google Drive: uploading, downloading, sharing, organizing, and managing files and folders."
    identity_keywords:
      - "google drive"
      - "gdrive"
    planner_hints: |
      GOOGLE DRIVE: When user says "share this", check AVAILABLE ARTIFACTS for the
      resource to share and include its URL or ID in the step description.
    executor_hints: |
      GOOGLE DRIVE: Always report the file URL (webViewLink) in your response after
      uploading or creating a file.
      The authenticated user is implicit — NEVER ask for the user's email address or account info.

  notion:
    ui_components:
      API-post-page: "notion_page_editor"
    tool_names:
      - "API-post-search"
      - "API-get-block-children"
      - "API-patch-block-children"
      - "API-retrieve-a-block"
      - "API-update-a-block"
      - "API-delete-a-block"
      - "API-retrieve-a-page"
      - "API-patch-page"
      - "API-post-page"
      - "API-retrieve-a-page-property"
      - "API-move-page"
      - "API-retrieve-a-comment"
      - "API-create-a-comment"
      - "API-query-data-source"
      - "API-retrieve-a-data-source"
      - "API-update-a-data-source"
      - "API-create-a-data-source"
      - "API-list-data-source-templates"
      - "API-retrieve-a-database"
      - "API-get-user"
      - "API-get-users"
      - "API-get-self"
    display_name: "Notion"
    icon: "notion"
    requires_auth: true
    mcp_server: "notion"
    description: "Workspace and knowledge management via Notion: creating pages, managing databases, searching content, commenting, and organizing workspace."
    identity_keywords:
      - "notion"
    executor_hints: |
      NOTION: To create a page at the workspace top level, use API-post-page with
      parent: {"workspace": true}. Do NOT use "workspace" as a string or as page_id.
      To create under an existing page, use parent: {"type": "page_id", "page_id": "<uuid>"}.
      Include content in
      "children" as block objects. Use "properties" with "title" for page title:
      properties: {"title": [{"text": {"content": "Page Title"}}]}. Do NOT ask for
      parent page ID if user doesn't specify one — use workspace parent. To search
      for pages, use API-post-search.
      Always report the page URL and ID in your response after creating or modifying a page.
      IMPORTANT: The Notion API allows a MAXIMUM of 100 children blocks per request.
      Keep page content concise — use fewer, richer blocks. Combine related short
      paragraphs. Never exceed 95 blocks in a single API-post-page call.

