integrations:
  web_search:
    ui_components:
      "*": "web_search_card"
    tool_names:
      - "tavily_search"
      - "tavily_extract"
      - "tavily_crawl"
      - "tavily_map"
      - "tavily_research"
    display_name: "Web Search"
    icon: "web_search"
    mcp_server: "tavily"
    description: "Web search and research: finding information, answering questions, comparing options, discovering latest content online."
    identity_keywords: []
    executor_hints: |
      WEB SEARCH RESPONSE FORMAT:
      - Write an explanatory, well-structured summary of the search findings using proper
        markdown: headings (##, ###), bullet points, numbered lists, bold key terms, and
        comparisons where relevant.
      - Do NOT include source URLs, links, or references in your response text — the UI
        already renders a web search card with all sources and links. Showing them again
        is redundant.
      - Focus on synthesizing insights, key takeaways, and actionable information rather
        than just listing raw results.

  gmail:
    ui_components:
      send_gmail_message: "email_composer"
      draft_gmail_message: "email_composer"
      get_gmail_messages_content_batch: "email_list_card"
      get_gmail_message_content: "email_list_card"
      get_gmail_thread_content: "email_list_card"
      get_gmail_threads_content_batch: "email_list_card"
    tool_names:
      - "search_gmail_messages"
      - "get_gmail_message_content"
      - "get_gmail_messages_content_batch"
      - "get_gmail_thread_content"
      - "get_gmail_threads_content_batch"
      - "send_gmail_message"
      - "draft_gmail_message"
      - "list_gmail_labels"
      - "manage_gmail_label"
      - "modify_gmail_message_labels"
      - "batch_modify_gmail_message_labels"
      - "get_gmail_attachment_content"
      - "list_gmail_filters"
      - "create_gmail_filter"
      - "delete_gmail_filter"
    display_name: "Gmail"
    icon: "gmail"
    requires_auth: true
    mcp_server: "google_workspace"
    description: "Email operations via Gmail: sending, drafting, reading, searching, labeling, filtering, and managing email messages and threads."
    identity_keywords:
      - "gmail"
      - "email"
      - "mail"
    planner_hints: |
      GMAIL: When user says "mail/send/email this", check AVAILABLE ARTIFACTS for the
      most recent document or content. Embed its URL and title into the step description.
      Compose a sensible subject from artifact name if not specified by user.
    executor_hints: |
      GMAIL: Use artifact title as email subject if user did not specify one. Include
      artifact URL in the email body. Use send_gmail_message with to, subject, body params.
      Do NOT ask the user for subject or body if they can be inferred from artifacts and context.
      The authenticated user is implicit — NEVER ask for the user's email address or userId.
      If any Gmail tool fails with an auth error, tell the user to reconnect Gmail.
      READING EMAILS: When searching or listing emails, ALWAYS follow up search_gmail_messages
      with get_gmail_messages_content_batch using the returned message IDs to fetch full content.
      Never report raw message IDs to the user. Your final response should summary of all mails getched under their's specific category like social, promotions, updates, forums, primary etc and below then the mail info in brief.
      Do NOT list out individual emails in your response text; the UI will render a rich email card from the tool results automatically.

  google_docs:
    ui_components:
      create_doc: "document_editor"
    tool_names:
      - "search_docs"
      - "get_doc_content"
      - "list_docs_in_folder"
      - "create_doc"
      - "modify_doc_text"
      - "find_and_replace_doc"
      - "insert_doc_elements"
      - "insert_doc_image"
      - "update_doc_headers_footers"
      - "batch_update_doc"
      - "inspect_doc_structure"
      - "create_table_with_data"
      - "debug_table_structure"
      - "export_doc_to_pdf"
      - "update_paragraph_style"
      - "read_document_comments"
      - "create_document_comment"
      - "reply_to_document_comment"
      - "resolve_document_comment"
    display_name: "Google Docs"
    icon: "google_docs"
    requires_auth: true
    mcp_server: "google_workspace"
    description: "Document creation and editing via Google Docs: creating, writing, editing, commenting, exporting, and formatting documents."
    identity_keywords:
      - "google doc"
      - "google docs"
      - "gdoc"
      - "gdocs"
    planner_hints: |
      GOOGLE DOCS: When creating a document, include the desired title in the step
      description. If content comes from a previous step, reference the step number.
    executor_hints: |
      GOOGLE DOCS CONTENT FORMAT: When calling create_doc, modify_doc_text, or insert_doc_elements,
      the content/text parameter MUST be plain text only. Do NOT use markdown (no **, ##, -, ```).
      Do NOT use HTML tags. Google Docs renders them as literal characters.
      Instead: write natural prose, use blank lines between sections, and use the tool's native
      formatting parameters for headings/bold if available (e.g., insert_doc_elements with
      proper element types, or update_paragraph_style for headings).
      Always report the document URL and ID in your response after creating or modifying a document.
      The authenticated user is implicit — NEVER ask for the user's email address to create or edit documents.

  google_sheets:
    ui_components:
      create_spreadsheet: "sheets_editor"
    tool_names:
      - "get_spreadsheet_info"
      - "read_sheet_values"
      - "modify_sheet_values"
      - "create_spreadsheet"
      - "list_spreadsheets"
      - "format_sheet_range"
      - "create_sheet"
      - "add_conditional_formatting"
      - "update_conditional_formatting"
      - "delete_conditional_formatting"
      - "read_sheet_comment"
      - "create_sheet_comment"
      - "reply_to_sheet_comment"
      - "resolve_sheet_comment"
      - "read_spreadsheet_comments"
      - "create_spreadsheet_comment"
      - "reply_to_spreadsheet_comment"
      - "resolve_spreadsheet_comment"
    display_name: "Google Sheets"
    icon: "google_sheets"
    requires_auth: true
    mcp_server: "google_workspace"
    description: "Spreadsheet operations via Google Sheets: creating, reading, writing, and modifying spreadsheet data, cells, and ranges."
    identity_keywords:
      - "google sheet"
      - "google sheets"
      - "spreadsheet"
    planner_hints: |
      GOOGLE SHEETS: When the task involves creating a spreadsheet AND populating it
      with data, always combine ALL actions (create, write data, format headers) into
      a SINGLE step. Never create separate steps for creating, writing, or formatting —
      do everything in one step so the user sees a single approval card.
    executor_hints: |
      GOOGLE SHEETS: When creating a new spreadsheet that will contain data, you MUST
      follow ALL of these steps in order within the same execution:
      1. Call create_spreadsheet with the title (and sheets/headers if the tool supports it).
      2. Call modify_sheet_values to write the header row as values[0] followed by all data rows.
      3. ALWAYS call format_sheet_range to format the header row with:
         - bold: true
         - backgroundColor: a light green color (e.g. RGB 183/225/205 or similar)
         - horizontalAlignment: "CENTER"
         Apply this format to the entire first row (e.g. range "Sheet1!A1:Z1" or scoped to the actual column count).
      4. Freeze the header row so it stays visible when scrolling (if the tool supports freezeRows).
      5. Always report the spreadsheet URL and ID in your response.
      Formatting the header row is MANDATORY — never skip step 3.
      The authenticated user is implicit — NEVER ask for the user's email address or account info.

  google_slides:
    tool_names:
      - "create_presentation"
      - "get_presentation"
      - "batch_update_presentation"
      - "get_page"
      - "get_page_thumbnail"
      - "read_presentation_comment"
      - "create_presentation_comment"
      - "reply_to_presentation_comment"
      - "resolve_presentation_comment"
      - "read_presentation_comments"
    display_name: "Google Slides"
    icon: "google_slides"
    requires_auth: true
    mcp_server: "google_workspace"
    description: "Presentation operations via Google Slides: creating, editing, and managing slide presentations."
    identity_keywords:
      - "google slides"
      - "presentation"
    executor_hints: |
      GOOGLE SLIDES: Always report the presentation URL and ID in your response after
      creating a presentation.
      The authenticated user is implicit — NEVER ask for the user's email address or account info.

  google_calendar:
    ui_components:
      create_event: "calendar_event_editor"
    tool_names:
      - "list_calendars"
      - "get_events"
      - "create_event"
      - "modify_event"
      - "delete_event"
      - "query_freebusy"
    display_name: "Google Calendar"
    icon: "google_calendar"
    requires_auth: true
    mcp_server: "google_workspace"
    description: "Calendar management via Google Calendar: scheduling meetings, creating events, checking availability, and managing appointments."
    identity_keywords:
      - "google calendar"
      - "calendar"
    planner_hints: |
      GOOGLE CALENDAR: When the user wants to create an event, plan a single create_event
      step. Do NOT add clarification steps for missing details like title or time — the
      executor will call the tool directly with any available information.
    executor_hints: |
      GOOGLE CALENDAR — CRITICAL RULE FOR create_event:
      ALWAYS call the create_event tool immediately, even if title, start time, or end
      time are not specified. Use these defaults for any missing fields:
        - summary (title): "New Event"
        - calendar_id: "primary"
        - start_time: the next full hour from now in RFC3339 format (e.g. "2026-03-24T15:00:00Z")
        - end_time: 1 hour after start_time in RFC3339 format
        - timezone: "UTC"
      NEVER respond with a question asking for the event title or time. The user will
      review and edit all fields in the interactive form shown in the UI before the event
      is actually created. Always report the event link (htmlLink) in your response after
      creating or modifying an event.
      The authenticated user is implicit — NEVER ask for the user's email address or account info.

