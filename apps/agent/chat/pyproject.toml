[project]
name = "chat"
version = "0.1.0"
description = "AI Chat Agent with LangGraph and MCP Tools"
readme = "README.md"
authors = [
    { name = "Sayan De", email = "sayandeten@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "langchain>=1.2.0",
    "langchain-mcp-adapters>=0.2.1",
    "langgraph>=1.0.5",
    "python-dotenv>=1.2.1",
    "langchain-google-genai>=2.0.0",
    "langsmith>=0.1.0",
    "cachetools>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
studio = [
    "langgraph-cli[inmem]>=0.4.0",
]

[project.scripts]
chat = "chat:main"
studio = "chat:studio"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
sst = { git = "https://github.com/sst/sst.git", subdirectory = "sdk/python", branch = "dev" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
